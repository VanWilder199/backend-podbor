spring:
  application:
    name: marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:marketplace}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jooq:
    sql-dialect: POSTGRES

server:
  port: 8080

jwt:
  secret: "this-is-a-very-long-secret-key-for-testing-purposes-only-must-be-32-chars"
  access-token-expiration: 15
  refresh-token-expiration: 43200
  admin-access-token-expiration: 1440

s3:
  endpoint: ${S3_ENDPOINT:https://s3.hoster.by}
  bucket: ${S3_BUCKET:marketplace-media}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${[Secrets3]:}
  region: ${S3_REGION:us-east-1}
  presigned-url-ttl-minutes: 60

unisender:
  api-key: ${UNISENDER_API_KEY:}

bepaid:
  shop-id: ${BEPAID_SHOP_ID:}
  secret-key: ${BEPAID_SECRET_KEY:}
  webhook-secret: ${BEPAID_WEBHOOK_SECRET:}
  test-mode: ${BEPAID_TEST_MODE:true}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:local}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  max-age: 24h

app:
  base-url: http://localhost:8080

logging:
  level:
    root: INFO
    by.marketplace: INFO
    org.springframework.security: WARN
    org.jooq.tools.LoggerListener: INFO       # никогда не DEBUG вне local (TOTP-секреты и хэши в SQL)
    org.jooq.Constants: WARN                  # убрать баннер jOOQ
    software.amazon.awssdk: WARN
    software.amazon.awssdk.request: WARN      # на DEBUG пишет запросы к S3
  pattern:
    correlation: "[%X{traceId:-}] [%X{userId:-}%X{adminId:-}%X{tgUserId:-}%X{job:-}] "